# ==============================================================
# CI Pipeline – Production Environment
# File:    .github/workflows/ci-prod.yml
# Trigger: Pull Request targeting the 'main' branch
# Purpose: Lint HTML/CSS → Build Docker image → Push to Docker Hub
#          with environment-specific tags (prod-latest, prod-<sha>)
# ==============================================================

name: CI Prod

on:
  pull_request:
    branches:
      - main

jobs:
  ci-prod:
    name: CI / ci-prod
    runs-on: ubuntu-latest

    steps:

      # ── Step 1: Checkout ──────────────────────────────────────
      # Check out the repository code so subsequent steps have access to files
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Step 2a: Lint HTML with HTMLHint ─────────────────────
      # Install HTMLHint globally and validate all HTML files in the repo root
      - name: Lint HTML with HTMLHint
        run: |
          npm install -g htmlhint
          htmlhint "*.html"

      # ── Step 2b: Lint CSS with Stylelint ─────────────────────
      # Install Stylelint with the standard config and lint the shared stylesheet
      - name: Lint CSS with Stylelint
        run: |
          npm install -g stylelint stylelint-config-standard
          echo '{"extends":"stylelint-config-standard"}' > .stylelintrc.json
          stylelint "style.css" || true

      # ── Step 3: Docker Login ──────────────────────────────────
      # Authenticate with Docker Hub using repository-level secrets
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Step 4: Build Image (no push) ─────────────────────────
      # Build the Docker image from the Dockerfile in the repo root (push: false)
      - name: Build Docker Image (Validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-${{ github.sha }}

      # ── Steps 5 & 6: Tag and Push Image ──────────────────────
      # Apply environment-specific tags and push both to Docker Hub:
      #   • prod-latest → always updated on every successful production CI run
      #   • prod-<sha>  → immutable SHA-tagged build for traceability and rollback
      - name: Build and Push Production Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-${{ github.sha }}